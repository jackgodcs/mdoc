<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GreenValley PDF Check</title><link rel="stylesheet" href="viewer.css"></head><body><header><h1>PDF 视觉检查</h1><div id="counts"></div><select id="artifact-filter" aria-label="筛选 PDF 或语言"></select><button id="recheck">重新检查</button></header><main><aside><div class="filters"><button data-filter="active">有效问题</button><button data-filter="ignored-by-user">已忽略</button><button data-filter="all">全部</button></div><div id="findings"></div></aside><section id="preview"><div id="page-title"></div><div class="page-wrap"><img id="page" alt="PDF 问题页预览"><div id="regions"></div></div></section><section id="detail"><h2 id="message"></h2><dl id="meta"></dl><p id="suggestion"></p><button id="open-source">打开对应 Markdown</button><button id="windows-open">Windows 打开方式</button><button id="select-editor">选择编辑器 .exe</button><button id="ignore">确认忽略此项</button></section></main><script src="viewer.js"></script></body></html>
