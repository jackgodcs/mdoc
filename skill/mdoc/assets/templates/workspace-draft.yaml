schema_version: 1
workspace:
  id: replace-me
  formal_vcs: none
product:
  id: replace-me
  display_name: Replace me
books:
  user-guide:
    root: Guide
    source_locale: zh
    locales:
      zh:
        root: zh
        language: zh
      en:
        root: en
        language: en
    content_root: Main
    assets_root: images
    navigation:
      summary: Summary.md
locales: {}
writing: {}
screenshots:
  auto_open_assistant: true
quality_gate:
  default_profile: basic
  required_reviews: []
  safe_fixes: true
  rules: []
publishing:
  allow_deletions: false
generators: {}
build_adapters: {}
retention: {}
pdf:
  defaults:
    paper_size: a4
    margins_pt:
      left: 67
      right: 67
      top: 36
      bottom: 36
    image_optimization:
      enabled: true
      target_dpi: 180
      max_width_px: 1048
      min_bytes: 20480
      jpeg_quality: 75
      jpeg_subsampling: "4:4:4"
      transparent_background: white
      never_upscale: true
    optimization:
      enabled: true
      recompress_flate: true
      compression_level: 9
      object_streams: generate
    toc:
      right_value: page
      show_left_number: true
    bookmarks:
      levels: 5
      show_left_number: true
    cover:
      enabled: true
      preserve_aspect_ratio: true
    page_numbers:
      enabled: true
      position: right
    concurrency:
      builds: 3
      images: auto
  retention:
    failed_work_days: 7
    batch_reports: 20
    keep_successful_book_work: false
