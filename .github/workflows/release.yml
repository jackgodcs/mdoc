name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.0.0
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - run: python -m unittest discover -s skill/mdoc/scripts -p "test_*.py" -v
      - run: python -m unittest discover -s skill/mdoc/tests -p "test_*.py" -v
      - run: python runtime-bootstrap/test_install_transaction.py -v
      - run: python -m unittest discover -s scripts -p "test_*.py" -v
      - run: python scripts/release_check.py
      - run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
  publish:
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          prerelease: false
          files: dist/mdoc-*-windows-x64.zip
          fail_on_unmatched_files: true
