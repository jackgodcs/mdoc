name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s skill/mdoc/scripts -p "test_*.py" -v
      - run: python -m unittest discover -s scripts -p "test_*.py" -v
      - run: python scripts/release_check.py
      - run: python scripts/build_release.py
